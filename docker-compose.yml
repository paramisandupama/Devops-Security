# =============================================================================
# IE3142 - DevSecOps pipeline project
# Hardened OWASP Juice Shop, two tiers plus an optional secret store.
#
#   docker compose up --build        # web on http://localhost:8080
#   docker compose -f docker-compose.yml -f docker-compose.vault.yml up --build
#
# First run only:  ./scripts/setup.sh   (generates the signing key pair)
# =============================================================================

services:

  # ---------------------------------------------------------------------
  # Public-facing tier. The ONLY service that publishes a port.
  # ---------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        API_IMAGE: ie3142-juice-shop-api:1.0
    image: ie3142-juice-shop-web:1.0
    container_name: ie3142-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------
  # Application tier. Not published to the host - reachable only through
  # the web tier, on the internal "frontend" network.
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ie3142-juice-shop-api:1.0
    container_name: ie3142-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # "file"  = read the PEM from the Docker secret below (default)
      # "vault" = fetch it from HashiCorp Vault at start-up
      SECRET_PROVIDER: "${SECRET_PROVIDER:-file}"
      JWT_SECRET_FILE: /run/secrets/jwt_private_key
      # Defence in depth for the SSRF fix: when set, the avatar endpoint will
      # only fetch images from these hosts. Leave empty to fall back to the
      # "reject private/reserved addresses" rule.
      IMAGE_HOST_ALLOWLIST: "${IMAGE_HOST_ALLOWLIST:-}"
    secrets:
      - jwt_private_key
    volumes:
      - juice-shop-data:/juice-shop/data
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/rest/admin/application-version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5

# -----------------------------------------------------------------------------
# Secrets. The file is generated locally by scripts/setup.sh and is git-ignored;
# it is never committed and never baked into an image.
# -----------------------------------------------------------------------------
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key

volumes:
  juice-shop-data:
    driver: local

# -----------------------------------------------------------------------------
# Networks are the trust boundary.
#   frontend : web <-> api            (bridge, reachable from the host via web)
#   backend  : api <-> vault          (internal - no route to the internet)
# -----------------------------------------------------------------------------
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
