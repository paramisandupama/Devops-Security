# ---------------------------------------------------------------------------
# NGINX reverse proxy for OWASP Juice Shop (IE3142 DevSecOps project)
#
# Trust boundary: everything left of this file is the public internet;
# everything to the right (the "api" service) is the internal Docker network.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

upstream juice_shop_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # ---- basic hardening ---------------------------------------------------
    server_tokens off;                 # do not advertise the NGINX version
    client_max_body_size 2m;           # cap upload size
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # ---- security headers (mitigations M1 / M7 in the threat model) --------
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"   always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # HSTS is commented out because the stack runs over plain HTTP locally.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---- REST API and data endpoints -> backend ----------------------------
    location ~ ^/(rest|api|assets|ftp|encryptionkeys|metrics|profile|file-upload|b2b|snippets|video|promotion|the/devs/are/so/lazy) {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass         http://juice_shop_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # ---- Socket.IO needs a real WebSocket upgrade --------------------------
    location /socket.io/ {
        proxy_pass         http://juice_shop_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---- Login is rate limited far more tightly (mitigation M6) ------------
    location = /rest/user/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://juice_shop_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ---- static single-page application ------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cached bundles get a long-lived, immutable cache header.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never serve dotfiles or source maps to the internet.
    location ~ /\. { deny all; }
}
