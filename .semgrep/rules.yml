rules:
  # Custom rules. The registry packs caught V1, V2 and V5 but were silent on
  # the SSRF and the BOLA, because both are properties of this application's
  # own authorisation logic rather than of a known dangerous API.
  - id: ie3142-sqli-sequelize-template-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A template literal is interpolated into models.sequelize.query(). Use
      named replacements (replacements: { ... }) so user input is bound as a
      parameter rather than concatenated into the statement (CWE-89).
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: models.sequelize.query(`...$X...`)
          - pattern: models.sequelize.query("..." + $X)

  - id: ie3142-ssrf-unvalidated-fetch
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      fetch() is called on a URL that comes from the request without passing
      the SSRF guard first. Validate with assertSafeImageUrl() so the server
      cannot be used as a proxy for internal addresses (CWE-918).
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery"
      owasp: "A10:2021 - Server-Side Request Forgery"
    patterns:
      - pattern-either:
          - pattern: fetch($URL)
          - pattern: fetch($URL, ...)
      - pattern-not: fetch(await assertSafeImageUrl($U))
      - pattern-not: fetch(await assertSafeImageUrl($U), ...)

  - id: ie3142-bola-missing-ownership-check
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A record is looked up by an identifier taken from the request without an
      ownership check against the session. Compare the id against the
      session-bound value and return 403 before the lookup (CWE-639).
    metadata:
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "API1:2023 - Broken Object Level Authorization"
    patterns:
      - pattern-either:
          - pattern: '$MODEL.findOne({ where: { id: req.params.$ID } })'
          - pattern: $MODEL.findByPk(req.params.$ID)

  - id: ie3142-hardcoded-private-key
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A PEM private key is embedded in the source. Anyone with read access to
      the repository can forge session tokens. Load the key from the secret
      store at runtime (CWE-798 / CWE-321).
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
    pattern-regex: '(?i)(const|let|var)\s+\w*[Kk]ey\w*\s*=\s*[''"]-----BEGIN[^-]*PRIVATE KEY-----'
